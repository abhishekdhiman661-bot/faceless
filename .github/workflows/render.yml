name: Render & Auto-Upload Tall Tale 3D Video

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Render 1080p Video on Cloud GPU
        run: |
          node tools/capture.mjs video renders/pfeilstorch-mystery.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfeilstorch-video
          path: renders/pfeilstorch-mystery.mp4

      - name: Publish Direct Release Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.0.0
          name: "Tall Tale 3D: The Stork That Solved Migration With A Spear In Its Neck"
          files: renders/pfeilstorch-mystery.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Upload to YouTube with SEO
        run: |
          python3 upload_youtube.py renders/pfeilstorch-mystery.mp4 "The Bird That Survived A Spear Through Its Neck 🎯🐦 #shorts" "Until 1822, Europeans believed birds turned into mice or hibernated under frozen lakes during winter!\n\nThen, a white stork landed in Germany with a 30-inch African wooden spear pierced straight through its neck... completely fine!\n\nThis single bird proved that animals migrate across continents.\n\nWhat is the craziest animal survival story you have ever heard? Tell us below! 👇\n\n🔔 Subscribe for daily insane true stories and weird history!\n\n#shorts #history #animals #birds #nature #crazyfacts #historyfacts"
