name: Render Deep Dive 3D Video

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Render 1080p Video on Cloud GPU
        run: |
          node tools/capture.mjs video renders/no-sleep-7-days.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: no-sleep-video
          path: renders/no-sleep-7-days.mp4

      - name: Publish Direct Release Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Deep Dive 3D: What Happens If You Don't Sleep For 7 Days"
          files: renders/no-sleep-7-days.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
